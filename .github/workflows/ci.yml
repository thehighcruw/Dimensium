name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Azul Zulu JDK 8 (toolchain)
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 8

      - name: Set up Azul Zulu JDK 25 (Gradle runtime)
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
          cache: gradle

      - name: Validate changelog
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            section=$(awk "/^## \[${version}\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
            entries=$(echo "$section" | grep -v '^\s*$' | grep -v '^###' || true)
            if [[ -z "$entries" ]]; then
              echo "CHANGELOG.md [${version}] section is empty. Add at least one entry." >&2
              exit 1
            fi
          else
            if ! grep -q '^## \[Unreleased\]' CHANGELOG.md; then
              echo "CHANGELOG.md is missing the [Unreleased] section." >&2
              exit 1
            fi
          fi

      - name: Check formatting (Spotless)
        run: ./gradlew spotlessCheck

      - name: Compile
        run: ./gradlew classes testClasses

      - name: SpotBugs
        run: ./gradlew spotbugsMain

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs-report
          path: build/reports/spotbugs/

      - name: Test
        run: ./gradlew test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/
