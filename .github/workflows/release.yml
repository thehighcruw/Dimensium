name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Azul Zulu JDK 8 (toolchain)
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 8

      - name: Set up Azul Zulu JDK 25 (Gradle runtime)
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
          cache: gradle

      - name: Build jar
        run: ./gradlew jar -PmodVersion=${{ github.ref_name }}

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: build/libs/*.jar
