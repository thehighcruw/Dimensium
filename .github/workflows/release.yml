name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Azul Zulu JDK 8 (toolchain)
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 8

      - name: Set up Azul Zulu JDK 25 (Gradle runtime)
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
          cache: gradle

      - name: Validate changelog
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          section=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          entries=$(echo "$section" | grep -v '^\s*$' | grep -v '^###' || true)
          if [[ -z "$entries" ]]; then
            echo "CHANGELOG.md has no entries for [$VERSION]. Run scripts/release.sh before tagging." >&2
            exit 1
          fi
          echo "$section" > /tmp/release_notes.md

      - name: Build jar
        run: ./gradlew clean jar reobfJar -PmodVersion=${{ github.ref_name }}

      - name: Generate release notes
        id: relnotes
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const { data } = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
            });
            return data.body;

      - name: Combine release notes
        run: |
          echo "$(cat /tmp/release_notes.md)" > /tmp/full_notes.md
          echo "" >> /tmp/full_notes.md
          echo "---" >> /tmp/full_notes.md
          echo "" >> /tmp/full_notes.md
          echo "${{ steps.relnotes.outputs.result }}" >> /tmp/full_notes.md

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: /tmp/full_notes.md
          files: build/libs/*.jar
