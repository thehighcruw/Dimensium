---
layout: default
---
<div class="site-header">
  <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
</div>

<div class="site-body">
  <nav class="sidebar">
    {% include sidebar.html items=site.data.nav %}
  </nav>

  <main class="content">
    <h1>{{ page.title }}</h1>
    {{ content }}
  </main>
</div>

<script>
  var baseurl = '{{ site.baseurl }}';
  document.querySelectorAll('.content a[href]').forEach(function(a) {
    var href = a.getAttribute('href');
    if (href.startsWith('/') && !href.startsWith(baseurl)) {
      a.setAttribute('href', baseurl + href);
    }
  });

  document.querySelectorAll('.nav-toggle').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      btn.closest('.nav-item').classList.toggle('open');
    });
  });

  document.querySelectorAll('.content h2').forEach(function(heading) {
    if (!heading.textContent.trim().startsWith('How it works')) return;

    var body = document.createElement('div');
    body.className = 'collapsible-body';
    var next = heading.nextElementSibling;
    while (next && !/^H[1-6]$/.test(next.tagName)) {
      var sibling = next.nextElementSibling;
      body.appendChild(next);
      next = sibling;
    }

    var details = document.createElement('details');
    var summary = document.createElement('summary');
    summary.textContent = heading.textContent;
    details.appendChild(summary);
    details.appendChild(body);

    heading.replaceWith(details);
  });
</script>
